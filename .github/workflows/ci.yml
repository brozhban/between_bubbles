name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - mobile
      # Релиз идёт мержем main в production, и до сих пор это была единственная ветка,
      # на которой проверки не запускались: в прод уезжало то, что никто не прогонял.
      - production

# GITHUB_TOKEN наследует права репозитория по умолчанию; проверкам достаточно чтения кода.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dependency security audit
        run: bun run audit

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        # Продакшен-сборка дневника требует адрес сайта: на нём лежат оферта и политика,
        # на которые ведёт галочка согласия. CI собирает не выкатываемый артефакт, поэтому
        # здесь стоит заглушка — настоящий адрес приходит в спеку из DO_WEBSITE_URL.
        env:
          VITE_WEBSITE_URL: https://website.invalid
        run: bun run build

      - name: Architecture boundaries
        run: bun run architecture:check

      - name: Webapp lint
        run: bun run --cwd webapp lint

      - name: Deployment and script tests
        run: bun run test:deploy

      - name: Contract tests
        run: bun run test:contracts

      - name: Webapp client tests
        run: bun run test:webapp

      - name: Website tests
        run: bun run test:website

      - name: Backend tests
        run: bun run test:backend

      - name: Backend Docker smoke
        run: bun run smoke:backend:docker

      - name: Install Playwright browser
        run: bun run --cwd webapp e2e:install

      - name: Webapp E2E smoke
        run: bun run e2e:webapp
